 text-anchor="middle" fill="#334155" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">SQL</text><path d="M930,263.5 L1268,263.5 L1268,135.0 L1345,135.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1341" y="130.0" font-size="12" text-anchor="end" fill="#334155">join</text><path d="M930,279.5 L1280,279.5 L1280,215.0 L1345,215.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1341" y="210.0" font-size="12" text-anchor="end" fill="#334155">admission check</text><path d="M930,295.5 L1292,295.5 L1292,367.5 L1345,367.5" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1341" y="362.5" font-size="12" text-anchor="end" fill="#334155">OrderConfirmed</text><path d="M930,311.5 L1304,311.5 L1304,440.0 L1345,440.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1341" y="435.0" font-size="12" text-anchor="end" fill="#334155">pre-signed link</text><path d="M930,522.5 L1316,522.5 L1316,230 L1345,230" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="938" y="516.5" font-size="12" text-anchor="start" fill="#334155">assign + admit</text><path d="M740,330 L740,352 L675,352 L675,680 L985,680 L985.0,725" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M985,680 L1157,680 L1157.5,725" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="685" y="664" font-size="12" text-anchor="start" fill="#334155">image + DB secret via the task&#x27;s public IP</text><text x="20" y="520" font-size="15" text-anchor="start" fill="#334155">Implementation (instructor guidance): one task in AZ a&#x27;s</text><text x="20" y="542" font-size="15" text-anchor="start" fill="#334155">public subnet (public IP for egress only; inbound only</text><text x="20" y="564" font-size="15" text-anchor="start" fill="#334155">from the ALB), no NAT gateway, single-AZ RDS.</text><text x="20" y="586" font-size="15" text-anchor="start" fill="#334155">Same Terraform as the HA design; tfvars switch modes.</text><text x="20" y="620" font-size="15" text-anchor="start" fill="#334155">Cost, whole stack (estimate): ≈ USD 72/month</text><text x="20" y="660" font-size="14" text-anchor="start" fill="#334155" font-style="italic">Solid: request path. Dashed: async, egress</text><text x="20" y="680" font-size="14" text-anchor="start" fill="#334155" font-style="italic">or optional. Dashed box: design only.</text></svg>
