name: Deploy Frontend to AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          # Real Cognito sign-in. The IDs are public identifiers (repository variables, not secrets),
          # set from `terraform output -raw cognito_user_pool_id` / `cognito_user_pool_client_id`.
          VITE_AUTH_MODE: cognito
          VITE_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          # Empty on purpose: the browser calls /api on the CloudFront domain, so no CORS is needed.
          VITE_API_BASE_URL: ""
        run: |
          # Without the IDs the build still succeeds, but the site would fail on load: stop before uploading.
          if [ -z "$VITE_COGNITO_USER_POOL_ID" ] || [ -z "$VITE_COGNITO_CLIENT_ID" ]; then
            echo "::error::Set repository variables COGNITO_USER_POOL_ID and COGNITO_CLIENT_ID (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Upload frontend to S3
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET_NAME }}
        run: |
          # Upload other files with short caching
          aws s3 sync frontend/dist/ "s3://$BUCKET/" \
            --exclude "index.html" \
            --exclude "assets/*" \
            --cache-control "public,max-age=300"

          # Upload Vite hashed assets with long caching
          aws s3 sync frontend/dist/assets/ "s3://$BUCKET/assets/" \
            --cache-control "public,max-age=31536000,immutable"

          # Always upload the HTML entry point last
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
